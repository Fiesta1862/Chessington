name: Build Chessington APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept SDK licenses (runner ships the Android SDK)
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Download Stockfish (android arm64) into assets
        run: |
          mkdir -p app/src/main/assets
          SF_VER=16
          curl -sL -o /tmp/sf.7z \
            https://github.com/official-stockfish/Stockfish/releases/download/sf_16/stockfish-android-avx2.tar
          tar -xf /tmp/sf.7z -C /tmp || true
          BIN=$(find /tmp -name "stockfish*" -type f ! -name "*.tar" | head -n1)
          if [ -z "$BIN" ]; then
            # fallback: build latest tag from source
            git clone --depth 1 https://github.com/official-stockfish/Stockfish.git /tmp/sf-src
            make -C /tmp/sf-src/src -j2 ARCH=armv8-a profile=n
            BIN=/tmp/sf-src/src/stockfish
          fi
          file "$BIN"
          cp "$BIN" app/src/main/assets/stockfish
          chmod +x app/src/main/assets/stockfish

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chessington-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/app-debug.apk
          name: Chessington ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Direct APK download. Sideload and go undefeated.
            - Hidden overlay assistant
            - Stockfish 16, Skill Level 20
            - Auto-move gestures on Chess.com
