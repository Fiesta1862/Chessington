plugins {
    id 'com.android.application'
}

android {
    namespace 'com.ofx.chessassistant'
    compileSdk 34

    defaultConfig {
        applicationId "com.ofx.chessassistant"
        minSdk 26
        targetSdk 34
        versionCode 4
        versionName "1.3-undefeated"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because "stdlib 1.8+ merged jdk8 classes; old jdk8 artifact duplicates them"
        }
    }
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
}
